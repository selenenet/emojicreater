<h1>EmojiReactor for Kettu</h1>
<p>将本页网址复制到 Kettu 的「设置 → Plugins → +」中，即可安装插件。</p>
<p>插件默认关闭自动反应。安装后请在设置中填写自己的目标频道 ID 和表情方案，再手动开启。</p>
